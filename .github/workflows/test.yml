name: test

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests and production build
        run: npm run test:ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Public UI smoke (not full-stack E2E)
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
