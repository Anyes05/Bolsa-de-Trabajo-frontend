name: test

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Generate coverage lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Publish generated lockfile
        uses: actions/upload-artifact@v5
        with:
          name: frontend-generated-lockfile
          path: package-lock.json
      - name: Install
        run: npm ci
      - name: Tests and production build
        run: npm run test:ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Public UI smoke (not full-stack E2E)
        run: npm run test:ui
      - name: Publish frontend coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-vitest-coverage
          path: coverage/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
